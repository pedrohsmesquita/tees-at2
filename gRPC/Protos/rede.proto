syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "TEES_AT2.Protos";
package rede;

service RedeSocial {
  // Comandos
  rpc CriarUsuario (CriarUsuarioRequest) returns (UsuarioMsg);
  rpc CriarPost (CriarPostRequest) returns (PostMsg);
  rpc Comentar (ComentarRequest) returns (ComentarioMsg);
  rpc Curtir (RelacaoRequest) returns (ResultadoRelacao);
  rpc Seguir (RelacaoRequest) returns (ResultadoRelacao);

  // Consultas
  rpc BuscarUsuario (IdRequest) returns (UsuarioMsg);
  rpc PostsDoUsuario (IdRequest) returns (ListaPosts);
  rpc BuscarPost (IdRequest) returns (PostMsg);
  rpc SeguidoresDe (IdRequest) returns (ListaUsuarios);
  rpc SeguindoDe (IdRequest) returns (ListaUsuarios);
  rpc FeedDoUsuario (IdRequest) returns (ListaPosts);
}

message IdRequest { int32 id = 1; }

message CriarUsuarioRequest { string nome = 1; string email = 2; }
message CriarPostRequest { int32 usuario_id = 1; string texto = 2; }
message ComentarRequest { int32 usuario_id = 1; int32 post_id = 2; string texto = 3; }

// Curtir: usuario_id curte alvo_id (post). Seguir: usuario_id segue alvo_id (usuário).
message RelacaoRequest { int32 usuario_id = 1; int32 alvo_id = 2; }
message ResultadoRelacao { bool criado = 1; }  // false = já existia

message UsuarioMsg { int32 id = 1; string nome = 2; string email = 3; string biografia = 4; }
message PostMsg {
  int32 id = 1;
  int32 usuario_id = 2;
  string conteudo = 3;
  google.protobuf.Timestamp criado_em = 4;
}
message ComentarioMsg { int32 id = 1; int32 usuario_id = 2; int32 post_id = 3; string texto = 4; }

message ListaPosts { repeated PostMsg posts = 1; }
message ListaUsuarios { repeated UsuarioMsg usuarios = 1; }